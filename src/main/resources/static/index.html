<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Product Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        h1 {
            color: blue;
            font-weight: bold;
        }

        .card {
            border-radius: 15px;
        }

        table {
            background-color: white;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .logout-btn {
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Product Management System</h1>

            <a href="/logout">
                <button class="logout-btn">Logout</button>
            </a>
        </div>

        <h3 class="text-center mb-4">Add / Update Product</h3>

        <form id="productForm">

            <input type="hidden" id="productId">

            <div class="mb-3">
                <input type="text" class="form-control" id="name" placeholder="Product Name" required>
            </div>

            <div class="mb-3">
                <input type="text" class="form-control" id="brand" placeholder="Brand" required>
            </div>

            <div class="mb-3">
                <input type="text" class="form-control" id="category" placeholder="Category" required>
            </div>

            <div class="mb-3">
                <input type="number" class="form-control" id="price" placeholder="Price" required>
            </div>

            <div class="mb-3">
                <input type="number" class="form-control" id="quantity" placeholder="Quantity" required>
            </div>

            <div class="mb-3">
                <input type="file" class="form-control" id="image">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                Add Product
            </button>

        </form>

    </div>

    <div class="card shadow p-4 mt-5">

        <input type="text"
               id="searchInput"
               class="form-control mb-4"
               placeholder="Search Product"
               onkeyup="searchProduct()">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Brand</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody id="productTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

let isAdmin = false;

window.onload = checkRole;

async function checkRole() {
    try {
        const response = await fetch("/api/user");
        const user = await response.json();

        if (user.role === "ADMIN") {
            isAdmin = true;
        } else {
            isAdmin = false;
            document.getElementById("productForm").style.display = "none";
        }

        fetchProducts();

    } catch (error) {
        console.error(error);
    }
}

function fetchProducts() {

    fetch("/api/products")
        .then(response => response.json())
        .then(data => {

            let table = document.getElementById("productTable");
            table.innerHTML = "";

            data.forEach(product => {

                let actionButtons = "";

                if (isAdmin) {
                    actionButtons = `
                        <button class="btn btn-success btn-sm"
                        onclick="editProduct(
                        '${product.id}',
                        '${product.name}',
                        '${product.brand}',
                        '${product.category}',
                        '${product.price}',
                        '${product.quantity}'
                        )">
                        Edit
                        </button>

                        <button class="btn btn-danger btn-sm"
                        onclick="deleteProduct(${product.id})">
                        Delete
                        </button>
                    `;
                } else {
                    actionButtons = `<span>No Permission</span>`;
                }

                let row = `
                    <tr>
                        <td>${product.id}</td>

                        <td>
                            <img src="/api/product/${product.id}/image">
                        </td>

                        <td>${product.name}</td>
                        <td>${product.brand}</td>
                        <td>${product.category}</td>
                        <td>${product.price}</td>
                        <td>${product.quantity}</td>

                        <td>${actionButtons}</td>
                    </tr>
                `;

                table.innerHTML += row;
            });

        });
}

document.getElementById("productForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        let id = document.getElementById("productId").value;

        let formData = new FormData();

        formData.append("product",
            new Blob([JSON.stringify({

                name: document.getElementById("name").value,
                brand: document.getElementById("brand").value,
                category: document.getElementById("category").value,
                price: document.getElementById("price").value,
                quantity: document.getElementById("quantity").value

            })], {
                type: "application/json"
            }));

        if (document.getElementById("image").files.length > 0) {
            formData.append(
                "imageFile",
                document.getElementById("image").files[0]
            );
        }

        if (id == "") {

            fetch("/api/product", {
                method: "POST",
                body: formData
            })

            .then(response => response.json())
            .then(data => {
                alert("Product Added Successfully");
                location.reload();
            });

        } else {
            alert("Update not added yet");
        }

    });

function editProduct(id, name, brand, category, price, quantity) {

    document.getElementById("productId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("brand").value = brand;
    document.getElementById("category").value = category;
    document.getElementById("price").value = price;
    document.getElementById("quantity").value = quantity;

    document.getElementById("submitBtn").innerText = "Update Product";
}

function deleteProduct(id) {

    if(confirm("Are you sure you want to delete this product?")) {

        fetch(`/api/product/${id}`, {
            method: "DELETE"
        })
        .then(response => {
            if(response.ok) {
                alert("Product Deleted Successfully");
                fetchProducts();
            } else {
                alert("Delete failed");
            }
        })
        .catch(error => {
            console.error(error);
            alert("Error deleting product");
        });

    }
}

function searchProduct() {

    let input = document.getElementById("searchInput").value.toLowerCase();
    let table = document.getElementById("productTable");
    let rows = table.getElementsByTagName("tr");

    for (let i = 0; i < rows.length; i++) {

        let productName = rows[i].getElementsByTagName("td")[2];

        if (productName) {

            let textValue = productName.textContent || productName.innerText;

            if (textValue.toLowerCase().indexOf(input) > -1) {
                rows[i].style.display = "";
            } else {
                rows[i].style.display = "none";
            }

        }

    }

}

</script>

</body>
</html>
